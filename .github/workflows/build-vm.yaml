name: Build VM Image
on:
  push:
    tags:
      - '**'
    branches:
      - build/**
    paths:
      - packages/**
      - config/bootc.vm.toml
      - config/images.common.lst
      - config/images.vm.lst
      - config/packages.common.lst
      - config/packages.vm.lst
      - root/**
      - Containerfile
      - .github/workflows/build-vm.yaml

env:
  REGISTRY: ghcr.io/tao-ce/cozy
  FS_TYPE: btrfs
  FEDORA_VERSION: "45"
  IMAGE_PFX: tao-ce-cozy-vm-

jobs:
  build:
    strategy:
      matrix:
        include:
        - fedora_flavor: quay.io/fedora/fedora-bootc
          name: server
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04

    steps:
    - name: Tar as root (setuid bit)
      run: |
        sudo chmod u+s /usr/bin/tar

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup cache
      uses: actions/cache@v5
      with:
        path: /var/lib/containers/storage
        key: ${{ runner.os }}-${{ runner.arch }}-containers-storage
 
    - name: Build VM Image
      run: |
        make requirements build-image build-ova

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.IMAGE_PFX }}${{ matrix.name }}
        path: ./output/${{ env.IMAGE_PFX }}${{ matrix.name }}.ova
        archive: false
        if-no-files-found: error
