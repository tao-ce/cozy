name: Build
on:
  push:
    # branches:
      # - main

env:
  REGISTRY: ghcr.io/tao-ce/cozy

jobs:
  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Image
      run: |
        sudo buildah build \
          -t ${{ env.REGISTRY }}/pi:latest \
          --build-arg FEDORA_FLAVOR=quay.io/fedora/fedora-bootc \
          --build-arg FEDORA_VERSION=44 \
          --target pi \
          --layers \
          .

    - name: Build Pi Image
      run: |
        mkdir -p output
        sudo podman run \
          --rm \
          -it \
          --privileged \
          --security-opt label=type:unconfined_t \
          -v ./config/bootc.toml:/config.toml:ro \
          -v ./output:/output \
          -v  /var/lib/containers/storage:/var/lib/containers/storage \
          quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --rootfs xfs \
            --chown $(id -u):$(id -g) \
            --log-level debug \
            -vv \
            --use-librepo \
            ${{ env.REGISTRY }}/pi:latest

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pi-image
        path: ./output
        if-no-files-found: error