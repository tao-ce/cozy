name: Build
on:
  push:
    # branches:
      # - main

env:
  REGISTRY: ghcr.io/tao-ce/cozy

jobs:
  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Image
      run: |
        sudo buildah build \
          -t ${{ env.REGISTRY }}/pi:latest \
          --build-arg FEDORA_FLAVOR=quay.io/fedora/fedora-bootc \
          --target base \
          --layers \
          .
        

    # - name: Build Image
    #   id: build-image
    #   uses: redhat-actions/buildah-build@v2
    #   with:
    #     image: ${{ env.REGISTRY }}/pi
    #     tags: latest ${{ github.sha }}
    #     containerfiles:
    #       ./Containerfile
    #     build-args: |
    #       FEDORA_VERSION=44
    #       FEDORA_FLAVOR=quay.io/fedora/fedora-bootc
    #     extra-args: |
    #       --target base

    # - name: Push Image
    #   uses: redhat-actions/push-to-registry@v2
    #   with:
    #     image: ${{ steps.build-image.outputs.image }}
    #     tags: ${{ steps.build-image.outputs.tags }}
    #     username: ${{ github.actor }}
    #     password: ${{ github.token }}
    #     registry: ghcr.io/${{ github.repository_owner }}
    #     extra-args: |
    #       --disable-content-trust

    # - name: Login registry
    #   uses: redhat-actions/podman-login@main
    #   with:
    #     username: ${{ github.actor }}
    #     password: ${{ github.token }}
    #     registry: ghcr.io/${{ github.repository_owner }}

    - name: Build Pi Image
      run: |
        mkdir -p output
        sudo podman run \
          --rm \
          -it \
          --privileged \
          --security-opt label=type:unconfined_t \
          -v ./config/bootc.toml:/config.toml:ro \
          -v ./output:/output \
          -v  /var/lib/containers/storage:/var/lib/containers/storage \
          quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --rootfs xfs \
            --chown $(id -u):$(id -g) \
            --log-level debug \
            -vv \
            --use-librepo \
            ${{ env.REGISTRY }}/pi:latest

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pi-image
        path: ./output
        if-no-files-found: error