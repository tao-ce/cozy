on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: The tag of the release
        required: true

env:
  PAGER: cat
  RELEASE_TAG: ${{ inputs.release-tag }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: identify workflows runs
        run: |
          gh run list \
            -R ${{ github.repository }} \
            -b ${{ env.RELEASE_TAG }} \
            --json databaseId \
            -q '.[].databaseId' \
            -s success > ./workflows-runs-ids.txt

      - name: identify artifacts
        id: identify-artifacts
        run: |
          cat ./workflows-runs-ids.txt | while read id; do
            gh api /repos/${{ github.repository }}/actions/runs/$id/artifacts -q '.artifacts[].id'
          done \
            | tr '\n' ',' \
            | sed \
              -e 's/^/ARTIFACTS_IDS=/' \
              -e 's/,$//' \
            | tee -a "${GITHUB_OUTPUT}"
          


      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.identify-artifacts.outputs.ARTIFACTS_IDS }}
          skip-decompress: true
          merge-multiple: true
          path: ./artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*

